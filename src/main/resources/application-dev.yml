spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://db:3306/admin_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    defer-datasource-initialization: false

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  web:
    resources:
      static-locations: file:${file.upload-dir},classpath:/static/

file:
  upload-dir: ./uploads
  base-url: http://localhost:8080/files

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging.level:
  org.hibernate.SQL: debug
  com.yoonji.adminproject: debug